name: build

on:
  push:
    branches: [main, "release-*"]
    tags: ["v*"]
  pull_request:

env:
  FLAG: v0.1.0

jobs:
  flagls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            shell: bash
          - os: macos-latest
            target: macos-arm64
            shell: bash
          - os: windows-latest
            target: windows-x86_64
            shell: msys2 {0}
            exe: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: FramaLuna/flag-lang
          ref: ${{ env.FLAG }}
          path: flag-lang
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc git diffutils
      - if: runner.os == 'Windows'
        run: echo "CC=gcc" >> "$GITHUB_ENV"
      - run: flag-lang/build.sh
      - run: ./build.sh flag-lang/build/flagc
      - run: |
          name=flagls-$(sed -n 's/^  "version": "\(.*\)",$/\1/p' vscode/package.json)-${{ matrix.target }}
          mkdir -p "build/$name"
          cp build/flagls${{ matrix.exe }} README.md LICENSE "build/$name/"
          tar -czf "build/$name.tar.gz" -C build "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: flagls-${{ matrix.target }}
          path: build/flagls-*.tar.gz

  vscode:
    needs: flagls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: flagls-*
          path: build
          merge-multiple: true
      - run: |
          for archive in build/flagls-*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            mkdir -p "vscode/server/${name#flagls-*-}"
            tar -xzf "$archive" -C "vscode/server/${name#flagls-*-}" --strip-components=1 --wildcards '*/flagls*'
          done
          ls -lR vscode/server
      - run: npx --yes @vscode/vsce package --out ..
        working-directory: vscode
      - uses: actions/upload-artifact@v7
        with:
          name: vscode
          path: "*.vsix"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flagls, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: test "$(node -p "require('./vscode/package.json').version")" = "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - run: awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = $2 == v; next} p' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" packages/* --draft --title "flag-lsp $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
